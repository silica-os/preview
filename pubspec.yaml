name: preview
description: Preview, the image and PDF viewer of Silica.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  exif: ^3.3.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  image: ^4.12.0
  intl: any
  silica_ui:
    git:
      url: https://github.com/silica-os/silica-ui.git
      ref: v1.0.0-alpha.12

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - icon/icon.png
